# --- Application ---
spring.application.name=farol-da-fe-api
spring.threads.virtual.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/

# --- Google Gemini (GenAI) ---
# Fail-fast: application will not start without GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-2.5-flash

# --- Telegram Bot ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}

# --- Rate Limiting ---
rate-limit.capacity=2
rate-limit.refill-tokens=2
rate-limit.refill-duration=1m

# --- HTTP Client Timeout (MVP) ---
gemini.timeout-seconds=30